<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Furna">
  <title>Furna</title>
  <!--
    An inverted U — the mouth of the cave — with a light burning inside it.
    Two strokes and a dot: at 16px the arch still reads as an arch and the dot
    still reads as a light, which is the only test an icon has to pass.

    Both use currentColor so the mark takes the colour of whatever holds it. The
    halo is the same colour at low opacity rather than a second hue, so it stays
    a glow on a dark background and does not turn into a grey ring on a light one.
  -->
  <!--
    As a favicon nothing sets `color`, and the default is black — which is
    invisible in a dark tab strip. These two rules give the file its own theme;
    where it is masked or inlined, `color` is inherited and they never apply.
  -->
  <style>
    svg { color: #4b3fa8; }
    @media (prefers-color-scheme: dark) { svg { color: #a996ff; } }
  </style>

  <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
    <path d="M5 28V17a11 11 0 0 1 22 0v11"/>
  </g>

  <circle cx="16" cy="18.5" r="6" fill="currentColor" opacity=".16"/>
  <circle cx="16" cy="18.5" r="3.2" fill="currentColor"/>
</svg>
